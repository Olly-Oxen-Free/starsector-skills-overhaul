# NIMBLE Configuration Template
#
# This file is auto-generated by /nimble:configure and serves as the
# project configuration for NIMBLE execution.
#
# Location: .nimble/config.yaml
# Version: 11.0.0

# Project metadata (auto-detected)
project:
  name: "Skills Overhaul"     # Project name
  runtime: "java"             # node | python | go | rust | etc.
  framework: ""               # next.js | react | django | etc.
  package_manager: ""         # pnpm | npm | yarn | pip | cargo | etc.

# Build/validation commands (auto-detected)
commands:
  build: "./build.sh"         # e.g., pnpm run build
  lint: ""                    # e.g., pnpm run lint
  test: "./build.sh test"     # e.g., pnpm test
  typecheck: ""               # e.g., pnpm run typecheck
  timeout_min: 8              # wall-clock limit per validate step and per agent build/test command
  # Empty, none, "-" or "~" skips a step.
  # test_changed: ""          # validate.sh --changed: e.g., npx vitest related --run {files}

# Per-scope validation (optional). Applies to validate.sh --changed and the
# stop hooks only. The first scope whose paths match a changed file owns it;
# only scopes with changed files run, with their own commands (top-level
# commands are not inherited). Files in no scope run the top-level commands;
# end with {paths: ["**"], commands: {}} to run nothing for them.
# Doc-only changes (.nimble/, brain/, *.md, text/images under docs/) run nothing; `*` matches dotfiles.
# validation:
#   require_submodules: true    # fail instead of skipping when a workspace submodule is missing;
#                               # unset: skip, but exit 2 when nothing ran; false: accept that
#   scopes:
#     - paths: ["vendor/fono/**"]            # own Cargo workspace
#       commands:
#         build: "cargo build --manifest-path vendor/fono/Cargo.toml"
#         lint: "cargo clippy --manifest-path vendor/fono/Cargo.toml -- -D warnings"
#         test: "cargo test --manifest-path vendor/fono/Cargo.toml"
#     - paths: ["modules/universal/nirvana-shell-iced/**"]
#       commands:
#         test: "cargo test -p nirvana-shell-iced --bins"
# CARGO_TARGET_DIR defaults to ${NIMBLE_TARGET_DIR:-$HOME/.cache/nimble-target}/<repo-key>, shared by all worktrees.

# File boundaries (project-specific)
boundaries:
  never_touch:                # Files agents must never modify
    - "build/"
    - "target/"
    - "*.jar"
  require_review:             # Files that flag for human review
    - "mod_info.json"
    - "build.sh"

# GitHub integration (auto-detected)
github:
  owner_type: ""              # organization | user
  owner: "Olly-Oxen-Free"     # GitHub username or org name
  repository: "starsector-skills-overhaul" # Repository name
  pull_requests: true         # false: no PRs or pushes; pr.sh merges branches locally with --no-ff

# Remote mode. Unset: no-remote mode when the repository has no origin.
# Uncomment to never push or call gh even with an origin; PRs become records
# under .nimble/prds/{prd}/prs/ and merge locally with --no-ff (scripts/pr.sh).
# git:
#   has_remote: false
#   push_submodules: true            # pr.sh merge pushes a pointed-at submodule commit before merging
#   advance_submodule_default: true  # ...and fast-forwards the submodule's default branch on a default-branch merge

# Tier routing limits for /nimble:go
tiers:
  bounded_max_tasks: 3
  spike_max_files: 3

# Commit conventions
commit:
  coauthor: true              # add coauthor_line as a trailer; /nimble:configure sets false when CLAUDE.md forbids it
  coauthor_line: "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
  conventional: true

# Test policy for validate.sh and task agents
tests:
  policy: targeted            # targeted | suite-only | none (none is allowed, not recommended)
  regression_per_fix: true

# Build cache (scripts/cache.sh). Worktrees share one cargo target dir per repository.
build:
  cache_max_gb: 80            # cache.sh sweep and doctor report the shared target dir above this
  sweep_days: 3               # incremental state and stray cache dirs older than this are removed
  sweep: auto                 # auto: /nimble:end sweeps; report: it only prints what it would remove

# Execution settings
execution:
  default_model: sonnet       # sonnet | opus
  max_parallel: 3             # Max concurrent tasks per wave
  max_parallel_builds: 2      # Max task chains building at once in the waves workflow
  stall_min: 30               # Minutes without activity before watchdog.sh reports a task stalled
  budget_min:                 # Agent time budget by task complexity; the agent stops past it
    low: 45                   # complexity 4 or less
    mid: 90                   # complexity 5 to 7
    high: 150                 # complexity 8 and above

  gates: []                   # Wave numbers to pause after for human review, e.g. [2, 4]
  pre_pr_checks:              # Validation before PR creation
    - build
    - typecheck
    - lint

  # Model selection configuration (v9.3)
  models:
    default: sonnet                    # Default model for all tasks
    complexity_threshold: 5            # Complexity >= N uses Opus
    escalation:
      after_failures: 1                # Failures before escalating to Opus
      triggers:                        # Additional escalation triggers
        - architectural_issues
        - type_system_issues

# Orchestration policy layer (v9.0+)
orchestration:
  integration:
    cadence: worktree           # worktree | wave | feature
    auto_merge_on_green: true   # Skip human if CI passes

# Review configuration
review:
  provider: code-reviewer     # code-reviewer | greptile | code-review-plugin
  max_rounds: 3               # Review/fix rounds before a human looks
  escalate_after: 1           # Failed rounds before sonnet → opus
  frequency: per-task         # per-task | per-wave
  threshold: 5                # Greptile score threshold (0-5)
  none_behavior: manual       # manual | auto-pass (when provider: none)

# Work tracking: aven is the ledger of identified work, beads the execution graph
work_tracking:
  ledger: auto                # auto (aven, plus tracker when its MCP tools exist) | aven | tracker | both | off
  beads: auto                 # auto | mcp | cli | off

# Brain: durable project knowledge in brain/
brain:
  enabled: true
  maintain_every: 25          # raw entries since last maintenance
